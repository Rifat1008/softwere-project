<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Gift Suggester - Upohar</title>
    <link rel="stylesheet" href="ai.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ai-container">
        <div class="ai-box scroll-reveal">
            <div class="ai-header">
                <img src="logo.png" alt="Upohar AI" class="ai-logo">
                <h2>Smart Gift</h2>
                <p>Describe your scenario and let our AI find the perfect gift.</p>
            </div>

            <div class="input-area">
                <textarea id="aiInput" placeholder="Tell me your scenario... (e.g., I need a gift for my sister's wedding, she loves minimalist decor)"></textarea>
                <button id="suggestBtn" class="ai-btn">
                    <span>Ask AI</span>
                    <div class="loader" id="loader"></div>
                </button>
            </div>

            <div id="resultBox" class="result-box">
                <div class="result-header">AI Suggestions:</div>
                <div id="aiResponse" class="ai-response">
                    Waiting for your scenario...
                </div>
            </div>
        </div>
    </div>

    <script src="ai.js"></script>
</body>
</html>
